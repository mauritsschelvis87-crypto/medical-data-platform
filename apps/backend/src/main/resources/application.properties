server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5433/medical_backend_full
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.ai.base-url=http://localhost:8001
app.medication.catalog-source-path=../ai-service/data/raw/medications.csv
app.dev.auto-replace-running-instance=true
