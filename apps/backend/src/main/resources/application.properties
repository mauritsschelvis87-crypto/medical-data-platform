server.port=${PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/medical_backend_full}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.data-source-properties.prepareThreshold=${SPRING_DATASOURCE_PREPARE_THRESHOLD:0}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

ai.service.url=${AI_SERVICE_URL:http://localhost:8001}
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:4200}
app.medication.catalog-source-path=${MEDICATION_CATALOG_SOURCE_PATH:../ai-service/data/raw/medications.csv}
app.dev.auto-replace-running-instance=${APP_DEV_AUTO_REPLACE_RUNNING_INSTANCE:true}
