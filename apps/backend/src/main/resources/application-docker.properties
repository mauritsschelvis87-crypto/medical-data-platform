server.port=8081

spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:medical_backend_full}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.ai.base-url=http://ai-service:8001
app.medication.catalog-source-path=/data/medications.csv
app.dev.auto-replace-running-instance=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8082,http://localhost:4200}
