<div class="app-shell" [attr.data-theme]="preferences.theme()">
  <app-header
    [doctor]="doctor()"
    [language]="preferences.language()"
    [theme]="preferences.theme()"
    [notice]="notice()"
    (languageChange)="preferences.setLanguage($event)"
    (themeChange)="preferences.setTheme($event)"
    (demoLoginClick)="showDemoLoginNotice()"
  />

  <main class="app-content">
    <router-outlet />
  </main>
</div>
