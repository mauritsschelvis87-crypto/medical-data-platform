<section class="search-shell">
  <div class="search-panel">
    <div class="search-box">
      <div class="search-box__input-shell">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M10 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16Zm0 2a6 6 0 1 0 0 12A6 6 0 0 0 10 4Zm11.71 15.29 1.41 1.41-4.12-4.12-1.41-1.41 4.12 4.12Z"
          />
        </svg>
        <input
          id="patient-search"
          type="text"
          [formControl]="searchControl"
          [placeholder]="preferences.t('searchPlaceholder')"
          (keydown)="onKeydown($event)"
        />
      </div>

      @if (loading()) {
        <div class="search-feedback">{{ preferences.t('loading') }}</div>
      } @else if (searchControl.value.trim().length >= 2 && results().length === 0) {
        <div class="search-feedback">{{ preferences.t('noResults') }}</div>
      }
    </div>

    @if (results().length > 0) {
      <div class="suggestions">
        @for (patient of results(); track patient.id; let index = $index) {
          <button
            type="button"
            class="suggestion-card"
            [class.is-active]="highlighted() === index"
            (click)="openPatient(patient.id)"
          >
            <span class="suggestion-card__number">{{ patient.patientNumber }}</span>
            <span class="suggestion-card__name">{{ patient.fullName }}</span>
            <span class="suggestion-card__meta">{{ formatDate(patient.birthDate) }}</span>
          </button>
        }
      </div>
    }
  </div>
</section>
